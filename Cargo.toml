[package]
name = "huion-mgr"
version = "0.1.0"
edition = "2021"
description = "Huion tablet manager for Linux (CLI + daemon)"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Input device reading (evdev)
evdev = "0.12"

# System
dirs = "6"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
